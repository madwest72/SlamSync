name: SlamSync CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code depuis ton dépôt
    - name: Copie du code Git
      uses: actions/checkout@v4

    # 2. Configurer la bonne version de PHP (par exemple 8.2 ou 8.3)
    - name: Installation de PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, dom, fileinfo, mysql
        coverage: none

    # 3. Copier le fichier d'environnement d'exemple
    - name: Création du fichier .env pour les tests
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    # 4. Installer les dépendances Laravel via Composer
    - name: Installation des packages Composer
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    # 5. Installer les packages front-end (DaisyUI, Tailwind, etc.) et compiler
    - name: Installation de Node.js et compilation du front
      run: |
        npm install
        npm run build

    # 6. Générer une clé de sécurité Laravel
    - name: Génération de la clé Laravel
      run: php artisan key:generate

    # 7. Donner les bonnes permissions aux dossiers Laravel
    - name: Permissions des dossiers
      run: chmod -R 777 storage bootstrap/cache

    # 8. Lancer les tests unitaires (Optionnel : commente cette ligne si tu n'as pas encore de tests)
    - name: Exécution des tests via PHPUnit
      run: php artisan test